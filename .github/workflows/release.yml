name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish src/BudgetApp.UI -c Release -r $rid -o out/$rid
            cp LICENSE THIRD-PARTY-NOTICES.txt out/$rid/
            (cd out/$rid && zip -r ../../BudgetLite-$rid.zip . -x '*.pdb')
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: BudgetLite-*.zip
          generate_release_notes: true
